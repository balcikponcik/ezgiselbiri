<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ezgi Koşuyor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen arcade, canvas fills, HUD on top. Single dark night-street look. */
:root{--bg:#160f22;--panel:#241935;--fg:#f6eefc;--gold:#ffc83d;--pink:#ff4f8b;--mint:#4fe3a6;--sick:#9bd13a;
--display:'Bungee',Impact,sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;overflow:hidden;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#wrap{position:relative;max-width:900px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px;box-sizing:border-box}
#hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{flex:1;min-width:160px;height:22px;background:var(--panel);border-radius:11px;overflow:hidden;position:relative;border:2px solid #3b2b55}
#fill{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .15s}
#fill.sick{background:var(--sick)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.08em;text-shadow:0 1px 2px #000}
#score{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold)}
#status{font-weight:800;font-size:13px;min-width:90px}
canvas{flex:1;width:100%;min-height:0;border-radius:14px;background:#1d1430;touch-action:manipulation;cursor:pointer}
#over{position:absolute;inset:60px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(22,15,34,.82);border-radius:14px;padding:16px}
#over img{width:150px;height:auto}
#over h1{font-family:var(--display);font-size:clamp(28px,7vw,48px);margin:0;color:var(--pink);text-wrap:balance}
#over p{margin:0;max-width:46ch;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:14px}
.legend b{color:var(--gold)}
button{font-family:var(--display);font-size:20px;background:var(--gold);color:#2a1a00;border:0;border-radius:12px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>

const kinds={pill:{e:'💊',v:+22},cig:{e:'🚬',v:-22},beer:{e:'🍺',v:-25}};
function spawn(){
  const r=Math.random();let k=r<.38?'pill':r<.7?'cig':'beer';

}

  ctx.fillStyle='#ffc83d22';for(let x=-off;x<W+160;x+=80)for(let y=G-40;y>G-100;y-=22)ctx.fillRect(x+12,y,8,10);
  // ground
  ctx.fillStyle='#3b2b55';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#ff4f8b55';
  const o2=dist%60;for(let x=-o2;x<W;x+=60)ctx.fillRect(x,G+20,30,4);
  // items
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){
    if(it.k==='biz'){
      const pulse=1+Math.sin(t*.15)*.08;ctx.save();ctx.translate(it.x,it.y);ctx.scale(pulse,pulse);
      ctx.shadowColor='#ffc83d';ctx.shadowBlur=24;ctx.fillStyle='#ffc83d';
      ctx.beginPath();ctx.roundRect(-70,-20,140,40,20);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#2a1a00';ctx.font="20px Bungee, Impact, sans-serif";ctx.fillText('BİZAHMET',0,2);ctx.restore();it.r=60;
    }else{ctx.font='38px serif';ctx.fillText(kinds[it.k].e,it.x,it.y)}
  }
  // Ezgi
  const px=p.x,base=G+p.y,air=p.y<0,sw=Math.sin(t*(sick>0?.2:.35));
  const hy=base-112,hip=base-42,sh=hy+30;
  ctx.lineCap='round';
  // legs: lace tights + boots
  const legs=[[-7,sw*16],[7,-sw*16]];
  for(const [dx,s] of legs){const fx=px+dx+(air?s*.3:s),fy=base-6;
    ctx.strokeStyle='#2a1f22';ctx.lineWidth=10;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(px+dx,hip);ctx.lineTo(fx,fy-10);ctx.stroke();
    ctx.strokeStyle='#5c4646';ctx.lineWidth=3;ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(px+dx,hip);ctx.lineTo(fx,fy-10);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.roundRect(fx-6,fy-14,13,16,3);ctx.fill();ctx.fillRect(fx+4,fy-2,3,6);ctx.fillStyle='#c9a24a';ctx.fillRect(fx-5,fy-9,11,2)}
  // back arm
  const arm=(s,c)=>{ctx.strokeStyle=c;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(px,sh+4);const ex=px+s*18,ey=sh+30;ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='#e9b9a1';ctx.beginPath();ctx.arc(ex,ey+3,4.5,0,7);ctx.fill();ctx.fillStyle='#4a0d1a';ctx.beginPath();ctx.arc(ex+1,ey+6,1.5,0,7);ctx.fill()};
  arm(-sw,'#0f0b12');
  // dress + coat
  ctx.fillStyle='#050505';ctx.beginPath();ctx.moveTo(px-12,sh);ctx.lineTo(px+12,sh);ctx.lineTo(px+15,hip+4);ctx.lineTo(px-15,hip+4);ctx.closePath();ctx.fill();
  const flap=Math.sin(t*.3)*4*(run?1:0);
  ctx.fillStyle='#17111b';
  ctx.beginPath();ctx.moveTo(px-20,sh);ctx.lineTo(px-9,sh);ctx.lineTo(px-11,hip+22);ctx.lineTo(px-27-flap,hip+20);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(px+20,sh);ctx.lineTo(px+9,sh);ctx.lineTo(px+11,hip+22);ctx.lineTo(px+27+flap,hip+20);ctx.closePath();ctx.fill();
  // necklace
  ctx.strokeStyle='#d9b45a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,sh-4,9,.3,Math.PI-.3);ctx.stroke();
  // fur collar
  for(let i=0;i<9;i++){const a=Math.PI*(.95+i*.14),r=20;ctx.fillStyle=i%2?'#241c26':'#1a141c';ctx.beginPath();ctx.arc(px+Math.cos(a)*r*1.1,sh+6+Math.sin(a)*-r*.4+ (i%3)*2,9,0,7);ctx.fill()}
  for(let i=0;i<9;i++){const a=Math.PI*(.05-i*.14),r=20;ctx.fillStyle=i%2?'#241c26':'#1a141c';ctx.beginPath();ctx.arc(px+Math.cos(a)*r*1.1,sh+6+Math.sin(a)*-r*.4+(i%3)*2,9,0,7);ctx.fill()}
  arm(sw,'#1b141f');
  // head (cut-out png)
  const HW=84,HH=HW*face.height/(face.width||1);
  if(boost>0){ctx.shadowColor='#ffc83d';ctx.shadowBlur=28}
  if(sick>0)ctx.filter='sepia(1) hue-rotate(50deg) saturate(2.2)';
  if(face.complete)ctx.drawImage(face,px-HW/2,sh+12-HH,HW,HH);
  ctx.filter='none';ctx.shadowBlur=0;
  if(sick>0){ctx.font='20px serif';ctx.fillText('🤢',px+HW/2,sh-HH)}
  // particles
  for(const q of parts){ctx.globalAlpha=q.l/40;ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,5,5)}ctx.globalAlpha=1;
  for(const f of floats){f.y+=f.vy;f.l--;const x=f.x+Math.sin((t+f.dx*30)*.05)*14;ctx.globalAlpha=Math.min(1,f.l/40);
    if(f.kind==='h'){ctx.font=f.sz+'px serif';ctx.fillText(['❤️','💖','💕','💗'][Math.floor(f.dx)%4],x,f.y)}
    else{ctx.save();ctx.translate(x,f.y);ctx.rotate(f.rot);ctx.font=f.sz+"px Bungee, Impact, sans-serif";ctx.fillStyle='#ff4f8b';ctx.fillText(f.s,0,0);ctx.restore()}}
  ctx.globalAlpha=1;floats=floats.filter(f=>f.l>0&&f.y>-60);
  if(fl){ctx.globalAlpha=Math.min(1,fl.l/30);ctx.fillStyle=fl.c;ctx.font="26px Bungee, Impact, sans-serif";ctx.fillText(fl.s,W/2,60);ctx.globalAlpha=1;if(--fl.l<=0)fl=null}
}
function ui(){const e=Math.max(0,Math.round(energy));fill.style.width=e+'%';fill.classList.toggle('sick',sick>0);pct.textContent='ENERJİ '+e;
  sc.textContent=Math.floor(dist/10)+' m';st.textContent=boost>0?'⚡ Bizahmet!':sick>0?'🤢 Hasta':'Sağlıklı';st.style.color=boost>0?'var(--gold)':sick>0?'var(--sick)':'var(--mint)'}
requestAnimationFrame(step);
</script>
